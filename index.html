<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Record dApp</title><link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
</head>
<body>
<main>
  <h1>🎓 Student Record dApp</h1>
  <p>Save and view your own student record on the Sepolia blockchain.</p>
  <img class="illustration" alt="Graduation cap icon" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/OOjs_UI_icon_academic.svg/120px-OOjs_UI_icon_academic.svg.png">
  <p><a href="https://sepolia.etherscan.io/" target="_blank" rel="noopener">Sepolia Etherscan</a> | <a href="https://remix.ethereum.org/" target="_blank" rel="noopener">Remix IDE</a></p>
  <h2>How it works</h2>
  <ul><li>Connect MetaMask on Sepolia.</li><li>Add or update your record.</li><li>Read your saved record.</li></ul>
  <button id="connect">Connect MetaMask</button><p id="wallet">Wallet not connected</p>
  <label>Name <input id="studentName" placeholder="Student name"></label>
  <label>Roll number <input id="rollNumber" placeholder="Roll number"></label>
  <label>Course <input id="course" placeholder="Course"></label>
  <div class="actions"><button id="add">Add Record</button><button id="update">Update Record</button><button id="read">View Record</button><button id="exists">Check Exists</button></div>
  <h2>Results</h2><pre id="status" aria-live="polite">Ready.</pre>
</main>
<script>
  // IMPORTANT: Paste your own deployed Sepolia contract address below.
 const CONTRACT_ADDRESS = "0x4033a16f0c805512e08944aF67560e0e03A2F1EA";
  const ABI = [
    "function addRecord(string name,string rollNumber,string course)",
    "function updateRecord(string name,string rollNumber,string course)",
    "function getRecord() view returns (string name,string rollNumber,string course)",
    "function recordExists() view returns (bool)"
  ];
  let provider, signer, contract;
  const status = document.getElementById('status');
  function show(message) { status.textContent = message; }
  async function connect() {
    if (!window.ethereum) throw new Error('Install MetaMask first.');
    if (!ethers.isAddress(CONTRACT_ADDRESS)) throw new Error('Paste your deployed contract address into index.html first.');
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    const network = await provider.getNetwork();
    if (network.chainId !== 11155111n) throw new Error('Switch MetaMask to Sepolia and reconnect.');
    signer = await provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    document.getElementById('wallet').textContent = 'Connected: ' + await signer.getAddress();
    show('Connected to Sepolia.');
  }
  function fields() { return [document.getElementById('studentName').value.trim(), document.getElementById('rollNumber').value.trim(), document.getElementById('course').value.trim()]; }
  async function write(method) {
    if (!contract) throw new Error('Connect wallet first.');
    const values = fields();
    if (!values[0] || !values[1]) throw new Error('Enter a name and roll number.');
    const tx = await contract[method](...values);
    show('Transaction sent: ' + tx.hash + '\nWaiting for confirmation...');
    await tx.wait();
    show('Transaction confirmed!\nHash: ' + tx.hash);
  }
  async function read() {
    if (!contract) throw new Error('Connect wallet first.');
    const [name, roll, course] = await contract.getRecord();
    show('Name: ' + name + '\nRoll number: ' + roll + '\nCourse: ' + course);
  }
  async function exists() { if (!contract) throw new Error('Connect wallet first.'); show('Record exists: ' + await contract.recordExists()); }
  function bind(id, action) { document.getElementById(id).addEventListener('click', async () => { try { await action(); } catch (e) { show('Error: ' + (e.shortMessage || e.reason || e.message)); } }); }
  bind('connect', connect); bind('add', () => write('addRecord')); bind('update', () => write('updateRecord')); bind('read', read); bind('exists', exists);
</script>
</body>
</html>
